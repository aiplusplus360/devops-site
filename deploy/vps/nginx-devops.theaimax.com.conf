# ---------------------------------------------------------------------------
# devops.theaimax.com — the React/Express site.
#
# This file is versioned in the repo AND installed on the VPS at
#   /etc/nginx/sites-available/devops.theaimax.com
# symlinked from /etc/nginx/sites-enabled/.
#
# The host runs around thirty unrelated nginx sites, several of them under the
# same theaimax.com domain. This block is therefore deliberately self-contained:
#
#   - it names its own host, its own upstream and its own log files
#   - it adds no new listening port (it reuses the existing 80/443)
#   - it includes no snippet shared with another site
#   - its ACME webroot is its own directory
#
# Editing it cannot affect any other site on the machine.
#
# --- Why the TLS block is committed rather than left to Certbot -------------
#
# The usual `certbot --nginx` flow rewrites this file in place to add the TLS
# block. That would fight this deployment: every `deploy` job overwrites the
# file with the version from the repo, silently removing TLS.
#
# So the TLS directives are committed here, and certificate issuance uses
# `certbot certonly --webroot`, which writes only to /etc/letsencrypt and never
# touches nginx's configuration. The result is a file that is identical on the
# server and in git, and a deploy that cannot break TLS.
#
# To issue or renew manually:
#   certbot certonly --webroot -w /var/www/devops.theaimax.com/certbot \
#     -d devops.theaimax.com
#
# To apply an edit:
#   nginx -t && systemctl reload nginx
# `reload` rather than `restart`, so in-flight connections are not dropped.
# ---------------------------------------------------------------------------

# The Node app listens on loopback only, on a port chosen after confirming it
# was free on this host. Because it is loopback, the port is not reachable from
# the internet and needs no firewall rule - nginx is the only way in.
upstream devops_theaimax_app {
    server 127.0.0.1:4310;
    keepalive 16;
}

# ------------------------------------------------------------------ port 80 --
server {
    listen 80;
    listen [::]:80;
    server_name devops.theaimax.com;

    # Renewals are answered from a webroot rather than proxied to the app, so a
    # renewal still succeeds while the app is down or mid-deploy. This location
    # must stay reachable over plain HTTP or automatic renewal will break.
    #
    # `^~` stops a later regex location from claiming the path first.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/devops.theaimax.com/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------- port 443 --
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name devops.theaimax.com;

    ssl_certificate     /etc/letsencrypt/live/devops.theaimax.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devops.theaimax.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Kept on the HTTP block above, but repeated here so that a renewal
    # challenge is answered even if it arrives over TLS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/devops.theaimax.com/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://devops_theaimax_app;
        proxy_http_version 1.1;

        # The app trusts only loopback as a proxy, so these headers are the real
        # client address as far as its contact-form rate limiter is concerned.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Responses are server-rendered and small; buffering them is fine and
        # lets nginx release the upstream worker sooner.
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # The client bundle is content-hashed by Vite, so those filenames can never
    # change meaning and are safe to cache for a year. `immutable` stops even a
    # revalidation request.
    #
    # `proxy_hide_header` first is load-bearing. The app sends its own
    # Cache-Control (express.static defaults to "public, max-age=0"), and
    # `add_header` appends rather than replaces - without hiding it, the client
    # receives two conflicting directives in one header and browsers disagree
    # about which wins.
    #
    # `add_header` without `expires`: using both emits two Cache-Control
    # headers, which is the same problem again.
    location /assets/ {
        proxy_pass http://devops_theaimax_app;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # The stylesheet, photographs and fonts are served under their original,
    # unhashed names, so a deploy can change them.
    #
    # These MUST revalidate on every use, not sit in the browser on a timer.
    # With a max-age here, a deploy that changes styles.css is invisible to
    # anyone who already has the old copy until that timer expires - and a
    # stylesheet that lags behind the HTML renders every rule added in the
    # meantime as unstyled markup.
    #
    # `no-cache` means "revalidate before use", not "do not store", so the app's
    # ETag still lets this be answered with a cheap 304.
    location ~* ^/(css|img|fonts)/ {
        proxy_pass http://devops_theaimax_app;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        etag on;
    }

    access_log /var/log/nginx/devops-access.log;
    error_log  /var/log/nginx/devops-error.log;
}
